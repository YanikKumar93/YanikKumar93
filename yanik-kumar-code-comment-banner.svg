<svg width="820" height="380" viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040608"/>
      <stop offset="55%" stop-color="#060a12"/>
      <stop offset="100%" stop-color="#03110c"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3b57"/>
      <stop offset="50%" stop-color="#173328"/>
      <stop offset="100%" stop-color="#12283b"/>
    </linearGradient>

    <filter id="nameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'Fira Code','Courier New', Courier, monospace; }
      .lineno { fill: #3a4a52; font-size: 13px; }
      .punct { fill: #5fae6e; font-size: 15px; }
      .tag { fill: #4fa3ff; font-size: 15px; }
      .val { fill: #d7e2ea; font-size: 15px; }
      .name { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .str { fill: #7fd99a; font-size: 15px; }
      .brac { fill: #9fb6c4; font-size: 15px; }
      .tabtext { fill: #8fa3b0; font-size: 13px; }
    </style>
  </defs>

  <!-- outer glow border -->
  <rect x="1" y="1" width="818" height="378" rx="14" fill="url(#borderGrad)" opacity="0.6"/>
  <!-- main card -->
  <rect x="4" y="4" width="812" height="372" rx="12" fill="url(#bgGrad)" stroke="#12212b" stroke-width="1"/>

  <!-- title bar -->
  <rect x="4" y="4" width="812" height="42" rx="12" fill="#080c10"/>
  <rect x="4" y="34" width="812" height="12" fill="#080c10"/>
  <circle cx="28" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="25" r="6" fill="#3ddc6f"/>
  <text x="94" y="30" class="mono tabtext">yanik_kumar.js</text>
  <line x1="4" y1="46" x2="816" y2="46" stroke="#101820" stroke-width="1"/>

  <!-- gutter divider -->
  <line x1="46" y1="46" x2="46" y2="376" stroke="#0d151b" stroke-width="1"/>

  <!-- line numbers -->
  <g class="mono lineno" text-anchor="end">
    <text x="38" y="86">1</text>
    <text x="38" y="112">2</text>
    <text x="38" y="138">3</text>
    <text x="38" y="164">4</text>
    <text x="38" y="190">5</text>
    <text x="38" y="216">6</text>
    <text x="38" y="242">7</text>
    <text x="38" y="268">8</text>
    <text x="38" y="294">9</text>
    <text x="38" y="320">10</text>
  </g>

  <!-- code content -->
  <g class="mono">
    <text x="60" y="86" class="punct">/**</text>

    <text x="60" y="112"><tspan class="punct">* </tspan><tspan class="tag">@name</tspan><tspan class="val">    </tspan><tspan class="name" filter="url(#nameGlow)">Yanik Kumar</tspan></text>

    <text x="60" y="138" class="punct">*</text>

    <text x="60" y="164"><tspan class="punct">* </tspan><tspan class="tag">@tagline</tspan><tspan class="val"> I love building new things and working upon</tspan></text>
    <text x="60" y="190"><tspan class="punct">*</tspan><tspan class="val">           new ideas to build something good and</tspan></text>
    <text x="60" y="216"><tspan class="punct">*</tspan><tspan class="val">           innovative.</tspan></text>

    <text x="60" y="242" class="punct">*</text>

    <text x="60" y="268"><tspan class="punct">* </tspan><tspan class="tag">@tools</tspan><tspan class="brac">   [</tspan><tspan class="str">"PyCharm"</tspan><tspan class="brac">, </tspan><tspan class="str">"C"</tspan><tspan class="brac">, </tspan><tspan class="str">"Blender"</tspan><tspan class="brac">, </tspan><tspan class="str">"AutoCAD"</tspan><tspan class="brac">,</tspan></text>
    <text x="60" y="294"><tspan class="punct">*</tspan><tspan class="brac">            </tspan><tspan class="str">"Filmora"</tspan><tspan class="brac">, </tspan><tspan class="str">"Photoshop"</tspan><tspan class="brac">, </tspan><tspan class="str">"SQL"</tspan><tspan class="brac">]</tspan></text>

    <text x="60" y="320" class="punct">*/</text>
  </g>

  <!-- bottom accent line -->
  <line x1="60" y1="345" x2="400" y2="345" stroke="#1c3d2c" stroke-width="2"/>
  <text x="60" y="365" class="mono" fill="#4a6b5a" font-size="12">&gt; profile compiled successfully</text>
</svg>
